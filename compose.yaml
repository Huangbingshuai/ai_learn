services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qingzhi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qingzhi-local}
      POSTGRES_DB: qingzhi
    ports:
      - "127.0.0.1:${QINGZHI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - qingzhi-postgres:/var/lib/postgresql/data
      - ./backend/data/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingzhi -d qingzhi"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  qingzhi-postgres:
