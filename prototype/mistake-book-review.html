<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9ef">
  <title>错题本 · UI 原型</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff9ef;
      --card: #fffdf8;
      --ink: #29243f;
      --muted: #71697d;
      --line: #d9d1d5;
      --blue: #3945c7;
      --sky: #e5e8ff;
      --mint: #a3e6d6;
      --yellow: #ffda69;
      --rose: #ffe2e6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ece9e4; color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    .workspace { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .device { width: min(100%, 390px); min-height: 780px; height: min(850px, calc(100vh - 48px)); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #d5d1ce; border-radius: 32px; background: var(--paper); box-shadow: 0 20px 56px #26213a22; }
    .status { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 23px; color: #28262b; font-size: 12px; }
    .island { width: 86px; height: 24px; border-radius: 99px; background: #080808; }
    .header { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--ink); }
    .back { width: 28px; height: 34px; padding: 0; border: 0; background: transparent; color: var(--ink); font-size: 28px; line-height: 1; }
    .title { margin: 0; font-size: 22px; font-weight: 850; letter-spacing: .02em; }
    .content { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 18px 24px; }
    .topic-list { display: grid; gap: 10px; }
    .topic-row { width: 100%; min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 13px 12px 15px; border: 1.5px solid var(--ink); border-radius: 4px 13px; background: var(--card); color: var(--ink); text-align: left; box-shadow: 2px 3px var(--ink); transition: transform .14s ease, box-shadow .14s ease; }
    .topic-row:active { transform: translate(2px, 3px); box-shadow: none; }
    .topic-name { min-width: 0; font-size: 16px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
    .topic-right { flex: none; display: flex; align-items: center; gap: 8px; }
    .topic-count { min-width: 54px; padding: 6px 9px; border-radius: 99px; background: var(--sky); color: var(--ink); text-align: center; font-size: 12px; font-weight: 850; }
    .chevron { color: var(--blue); font-size: 24px; line-height: 1; }
    .empty { min-height: 230px; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
    .practice-top { margin: -2px 0 16px; }
    .practice-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
    .practice-topic { max-width: 70%; padding: 4px 9px; border-radius: 2px 8px; background: var(--sky); font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .counter { color: var(--blue); font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .progress { display: grid; grid-template-columns: repeat(var(--total), 1fr); gap: 4px; }
    .progress span { height: 5px; border-radius: 99px; background: #ddd6dd; }
    .progress span.done { background: var(--blue); }
    .progress span.current { background: var(--yellow); outline: 1px solid var(--ink); }
    .question { margin: 0 0 12px; padding: 16px; border: 1.5px solid var(--ink); border-radius: 4px 14px; background: var(--card); box-shadow: 2px 3px #b9a7f5; }
    .eyebrow { margin: 0 0 9px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .05em; }
    .stem { margin: 0; font-size: 18px; font-weight: 850; line-height: 1.45; overflow-wrap: anywhere; }
    .options { display: grid; gap: 8px; }
    .option { min-height: 48px; display: flex; align-items: center; gap: 11px; padding: 9px 12px; border: 1.5px solid var(--ink); border-radius: 4px 10px; background: var(--card); color: var(--ink); text-align: left; font-size: 14px; line-height: 1.35; }
    .option.selected { border-color: var(--blue); background: var(--sky); box-shadow: 2px 2px var(--ink); }
    .letter { width: 25px; height: 25px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #f4eee7; font-size: 12px; font-weight: 900; }
    .option.selected .letter { background: var(--blue); color: white; }
    .submit, .next { width: 100%; min-height: 48px; margin-top: 16px; border: 1.5px solid var(--ink); border-radius: 4px 11px; background: var(--blue); color: white; font-size: 15px; font-weight: 850; box-shadow: 2px 3px var(--ink); }
    .submit:disabled { background: #d8d2de; color: #80798a; box-shadow: none; }
    .feedback { margin: 0 0 12px; padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: 4px 12px; background: var(--mint); }
    .feedback-title { margin: 0 0 4px; font-size: 17px; font-weight: 900; }
    .feedback-copy { margin: 0; color: #39564f; font-size: 13px; line-height: 1.45; }
    .mastered-wrap { display: flex; justify-content: center; margin: 13px 0 2px; }
    .mastered { min-width: 112px; min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 4px 10px; background: var(--mint); color: var(--ink); text-align: center; font-size: 14px; font-weight: 850; line-height: 1; }
    .remove-note { margin: 8px 0 0; color: var(--muted); text-align: center; font-size: 11px; }
    .tabs { flex: none; height: 58px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid var(--ink); background: var(--paper); }
    .tab { padding: 6px 9px; border-radius: 3px 7px; color: #5b5368; font-size: 12px; }
    .tab.active { border: 1px solid var(--ink); background: var(--yellow); color: var(--ink); font-weight: 850; }
    .home-indicator { flex: none; height: 19px; display: grid; place-items: center; background: var(--paper); }
    .home-indicator::after { width: 104px; height: 4px; border-radius: 9px; background: #171717; content: ""; }
    dialog { width: min(310px, calc(100% - 38px)); padding: 20px; border: 1.5px solid var(--ink); border-radius: 7px 16px; background: var(--card); color: var(--ink); box-shadow: 4px 5px var(--ink); }
    dialog::backdrop { background: #211d2b66; }
    .dialog-title { margin: 0 0 8px; font-size: 17px; font-weight: 900; }
    .dialog-copy { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .dialog-actions { display: flex; gap: 8px; }
    .dialog-actions button { min-height: 38px; flex: 1; border: 1px solid var(--ink); border-radius: 4px 9px; font-size: 13px; font-weight: 800; }
    .cancel { background: var(--card); color: var(--ink); }
    .confirm { background: var(--mint); color: var(--ink); }
    @media (max-width: 520px) { .workspace { padding: 0; } .device { width: 100%; height: 100dvh; min-height: 650px; border: 0; border-radius: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="device" aria-label="错题本原型">
      <div class="status"><span>9:41</span><span class="island" aria-hidden="true"></span><span>◉ ▰</span></div>
      <header class="header"><button class="back" id="back" aria-label="返回" hidden>‹</button><h1 class="title" id="page-title">错题本</h1></header>
      <div class="content" id="content"></div>
      <nav class="tabs" aria-label="主导航">
        <span class="tab">学习</span><span class="tab">题库</span><span class="tab">答题</span><span class="tab active">错题本</span><span class="tab">我的</span>
      </nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>
  <dialog id="confirm-dialog">
    <h2 class="dialog-title">这道题已经掌握了吗？</h2>
    <p class="dialog-copy">确认后，这道题会从错题本移除。</p>
    <div class="dialog-actions"><button class="cancel" id="cancel-remove">继续练习</button><button class="confirm" id="confirm-remove">确认移除</button></div>
  </dialog>
  <script>
    const topics = [
      { name: 'LangGraph', mistakes: [
        { stem: 'LangGraph 允许在图中引入循环，从而实现类似 for 循环的重复推理与行动选择。', options: ['正确', '错误'], correct: 0, explanation: '图可以通过循环边回到先前节点，直到满足结束条件。' },
        { stem: '以下哪些是 LangGraph 中支持的控制流类型？', options: ['顺序执行', '条件分支', '循环与并行', '以上都是'], correct: 3, explanation: 'LangGraph 可以组合顺序、条件分支、循环与并行控制流。' },
        { stem: '在 LangGraph 中，用于表示智能体当前状态的共享数据结构是什么？', options: ['Edge', 'Node', 'State', 'Graph'], correct: 2, explanation: 'State 保存节点之间共享和更新的数据。' },
      ] },
      { name: '四季成因', mistakes: [
        { stem: '一年里的季节性日照变化，主要由什么造成？', options: ['地轴倾斜与地球公转', '地球到太阳的距离变化', '月相变化', '自转速度变化'], correct: 0, explanation: '地轴倾斜配合地球公转，改变了太阳光照射角度和白昼长度。' },
        { stem: '北半球夏季时，南半球通常处于哪个季节？', options: ['春季', '夏季', '秋季', '冬季'], correct: 3, explanation: '地轴倾斜使两个半球在同一时段获得的日照不同。' },
      ] },
      { name: '月相变化', mistakes: [
        { stem: '月相变化主要取决于什么？', options: ['月球绕地球公转时的日照部分', '地球影子每天遮住月球', '云层厚度', '月球发光强弱'], correct: 0, explanation: '我们看到的是月球被太阳照亮部分的不同形状。' },
      ] },
    ];
    let screen = 'list';
    let topicIndex = 0;
    let questionIndex = 0;
    let selected = -1;
    let answered = false;
    let masteredTarget = null;
    const content = document.querySelector('#content');
    const back = document.querySelector('#back');
    const title = document.querySelector('#page-title');
    const modal = document.querySelector('#confirm-dialog');

    function renderList() {
      screen = 'list';
      back.hidden = true;
      title.textContent = '错题本';
      content.innerHTML = topics.length
        ? `<div class="topic-list">${topics.map((topic, index) => `<button class="topic-row" data-topic="${index}"><span class="topic-name">${topic.name}</span><span class="topic-right"><span class="topic-count">${topic.mistakes.length} 题</span><span class="chevron" aria-hidden="true">›</span></span></button>`).join('')}</div>`
        : '<div class="empty">暂无错题</div>';
      content.querySelectorAll('[data-topic]').forEach((button) => button.addEventListener('click', () => startTopic(Number(button.dataset.topic))));
    }

    function startTopic(index) {
      topicIndex = index;
      questionIndex = 0;
      selected = -1;
      answered = false;
      renderQuestion();
    }

    function renderQuestion() {
      screen = 'practice';
      back.hidden = false;
      title.textContent = '错题练习';
      const topic = topics[topicIndex];
      const question = topic.mistakes[questionIndex];
      const total = topic.mistakes.length;
      const marks = Array.from({ length: total }, (_, index) => `<span class="${index < questionIndex ? 'done' : index === questionIndex ? 'current' : ''}"></span>`).join('');
      const options = question.options.map((option, index) => `<button class="option ${selected === index ? 'selected' : ''}" data-option="${index}"><span class="letter">${String.fromCharCode(65 + index)}</span><span>${option}</span></button>`).join('');
      const feedback = answered ? `<section class="feedback"><h2 class="feedback-title">${selected === question.correct ? '答对啦！' : '这题答错了'}</h2><p class="feedback-copy">${question.explanation}</p></section><div class="mastered-wrap"><button class="mastered" id="mastered">已掌握</button></div><p class="remove-note">确认后从错题本移除</p><button class="next" id="next">${questionIndex + 1 < total ? '下一题' : '完成本主题'}</button>` : `<button class="submit" id="submit" ${selected < 0 ? 'disabled' : ''}>提交答案</button>`;
      content.innerHTML = `<div class="practice-top"><div class="practice-meta"><span class="practice-topic">${topic.name}</span><span class="counter">${String(questionIndex + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</span></div><div class="progress" style="--total:${total}">${marks}</div></div><section class="question"><p class="eyebrow">单选题</p><h2 class="stem">${question.stem}</h2></section><div class="options">${options}</div>${feedback}`;
      if (!answered) {
        content.querySelectorAll('[data-option]').forEach((button) => button.addEventListener('click', () => { selected = Number(button.dataset.option); renderQuestion(); }));
        document.querySelector('#submit').addEventListener('click', () => { if (selected >= 0) { answered = true; renderQuestion(); } });
      } else {
        document.querySelector('#mastered').addEventListener('click', () => { masteredTarget = questionIndex; modal.showModal(); });
        document.querySelector('#next').addEventListener('click', nextQuestion);
      }
    }

    function nextQuestion() {
      if (questionIndex + 1 >= topics[topicIndex].mistakes.length) { renderList(); return; }
      questionIndex += 1;
      selected = -1;
      answered = false;
      renderQuestion();
    }

    document.querySelector('#cancel-remove').addEventListener('click', () => modal.close());
    document.querySelector('#confirm-remove').addEventListener('click', () => {
      if (masteredTarget !== null) topics[topicIndex].mistakes.splice(masteredTarget, 1);
      modal.close();
      masteredTarget = null;
      if (!topics[topicIndex].mistakes.length) {
        topics.splice(topicIndex, 1);
        renderList();
        return;
      }
      if (questionIndex >= topics[topicIndex].mistakes.length) {
        renderList();
        return;
      }
      selected = -1;
      answered = false;
      renderQuestion();
    });
    back.addEventListener('click', renderList);
    renderList();
  </script>
</body>
</html>
